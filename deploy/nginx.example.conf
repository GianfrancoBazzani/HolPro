# Include inside your TLS server block; adjust upstream port to PORT.
# Streaming: no buffering and long reads for chat, task and plan SSE.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Connection "";
proxy_buffering off;
proxy_read_timeout 3600s;

# Voice upload: 10 MB audio plus multipart overhead.
location / {
    proxy_pass http://127.0.0.1:3000;
    client_max_body_size 11m;
}

# MCP accepts escaped HTML payloads; the application also bounds streamed bodies.
location = /api/mcp {
    proxy_pass http://127.0.0.1:3000;
    client_max_body_size 16m;
}
