services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      # Bound to the loopback address. Used to run the migration from the host.
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  web-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: ${PORT}
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-openai/gpt-5.4-mini}
      ASSISTANT_VOICE_SPEAKER: ${ASSISTANT_VOICE_SPEAKER:-alloy}
      MOCK_TASK_DURATION_MS: ${MOCK_TASK_DURATION_MS:-120000}
      ASSISTANT_SKILLS_DIR: ${ASSISTANT_SKILLS_DIR:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET_TOKEN: ${TELEGRAM_WEBHOOK_SECRET_TOKEN:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-webhook}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      database:
        condition: service_healthy

volumes:
  database-data:
